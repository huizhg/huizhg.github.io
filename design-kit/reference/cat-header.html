<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference: header cat (patrol mode)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
:root{--bg:#FAF8F3;--ink:#1C1B19;--muted:#5E5A52;--rule:#E4DFD4;--accent:#1F5C5A;--cat-w:64px;--dur:44s}
@media (prefers-color-scheme: dark){:root{--bg:#151412;--ink:#ECE8DF;--muted:#A39E93;--rule:#2E2B27;--accent:#6FB3AE}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.bar{display:flex;justify-content:space-between;align-items:center;padding-top:40px;min-height:84px}
.brand{white-space:nowrap;font-family:'Newsreader',serif;font-size:22px;font-weight:500;color:var(--ink)}
nav{display:flex;gap:32px;font-size:16px}
nav a{color:var(--muted)} nav a[aria-current]{color:var(--ink);font-weight:600}

/* ---- the cat ---- */
.cat-track{position:relative;height:60px;border-bottom:1px solid var(--rule)}
.walker{position:absolute;left:0;bottom:0;animation:walk var(--dur) linear infinite}
.flip{animation:turn var(--dur) linear infinite;transform-origin:50% 50%}
@keyframes walk{0%{transform:translateX(0)}50%{transform:translateX(var(--travel,800px))}100%{transform:translateX(0)}}
@keyframes turn{0%,49.99%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
.cat-btn{display:block;padding:6px 4px 0;margin:0;border:0;background:none;cursor:pointer;line-height:0}
.cat-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.cat-btn svg{width:var(--cat-w);height:auto;display:block;overflow:visible}
.leg{transform-box:fill-box;transform-origin:50% 0}
.leg-a{animation:swing .46s ease-in-out infinite alternate}
.leg-b{animation:swing .46s ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
.tail{transform-box:view-box;transform-origin:27px 38px;animation:sway 1.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(7deg)}}
.head{transform-box:view-box;transform-origin:88px 40px;transition:transform .3s ease}
/* hover or keyboard focus: stop, look up, show the label */
.walker:is(:hover,:focus-within),.walker:is(:hover,:focus-within) .flip{animation-play-state:paused}
.walker:is(:hover,:focus-within) .leg{animation:none}
.walker:is(:hover,:focus-within) .head{transform:rotate(-12deg)}
.tip{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;padding:4px 8px;border-radius:4px;background:#1C1B19;color:#FAF8F3;font:12px/1.3 'IBM Plex Mono',monospace}
.walker:is(:hover,:focus-within) .tip{display:block}
.hop{animation:hop .45s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.sleeper{display:none;position:absolute;right:0;bottom:0;align-items:flex-end;gap:2px}
.sleeper svg{width:var(--cat-w);height:auto}
.sleeper span{font:12px 'IBM Plex Mono',monospace;color:var(--muted);padding-bottom:36px}
@media (prefers-reduced-motion: reduce){.walker{display:none}.sleeper{display:flex}}
@media (max-width:640px){:root{--cat-w:44px}nav{gap:18px;font-size:15px}.home-link{display:none}.brand{font-size:19px}}
</style>
</head>
<body>
<header class="wrap">
  <div class="bar">
    <a class="brand" href="#">Kayla Zhang</a>
    <nav><a class="home-link" href="#" aria-current="page">Home</a><a href="#">Blog</a><a href="#">Publications</a><a href="#">CV</a></nav>
  </div>
  <div class="cat-track" id="track">
    <div class="walker" id="walker">
      <span class="tip" aria-hidden="true">tabby cat 0.03 · guacamole 0.97</span>
      <div class="flip"><div id="hopper">
        <button class="cat-btn" id="cat" aria-label="Pet the cat">

  </g>
</svg>
        </button>
      </div></div>
    </div>
    <div class="sleeper" role="img" aria-label="A tabby cat sleeping">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 74" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="56" cy="55" rx="36" ry="18" fill="#D9A066" stroke="#3B2A1E" stroke-width="1.8"/>

</header>
<main class="wrap" style="padding:64px 16px;color:var(--muted)">Page content goes here. Hover the cat to stop it, click it to make it hop.</main>
<script>
// Keep the cat inside the line: travel = line width minus the cat's own width.
const track = document.getElementById('track');
const walker = document.getElementById('walker');
const setTravel = () => track.style.setProperty('--travel', (track.clientWidth - walker.offsetWidth) + 'px');
new ResizeObserver(setTravel).observe(track);
setTravel();
// Click to hop (restart the animation each click).
const hopper = document.getElementById('hopper');
document.getElementById('cat').addEventListener('click', () => {
  hopper.classList.remove('hop'); void hopper.offsetWidth; hopper.classList.add('hop');
});
hopper.addEventListener('animationend', () => hopper.classList.remove('hop'));
</script>
</body>
</html>
